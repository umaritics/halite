# VM / shared staging deploy — bind localhost; Caddy exposes https://dev1.corp.curatech.pk/halite-api/
# Deployed by .github/workflows/deploy-staging.yml (partners do not need SSH).
#
# Local LLM (Ollama) has NO published ports — only halite-api on the internal bridge may call it.
# See docs/local-llm-staging.md.
services:
  postgres:
    image: postgres:16-alpine
    container_name: halite-postgres
    restart: unless-stopped
    networks:
      - halite_app
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: halite
      POSTGRES_DB: halite
    volumes:
      - halite_pg_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halite -d halite"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama:0.9.6
    container_name: halite-ollama
    restart: unless-stopped
    networks:
      - halite_app
    # No `ports:` — never bind 11434 on the host (WAN/Caddy must not reach Ollama).
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_ORIGINS: ""
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - halite_ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        DEPLOYED_AT: ${DEPLOYED_AT:-}
    container_name: halite-api
    restart: unless-stopped
    networks:
      - halite_app
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - halite_api_data:/app/data
    env_file:
      - ./backend/.env
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
      DEMO_MODE: "false"
      EXPOSE_OPENAPI: "false"
      ENABLE_GITEA_INTEGRATION: "false"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  halite_app:
    driver: bridge

volumes:
  halite_pg_data:
  halite_ollama_data:
  halite_api_data: