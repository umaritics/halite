name: CI

on:
  push:
    branches: [main, develop, usman, umar/mid1-graph-diagnostics]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: halite
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: halite_session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halite -d halite_session_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DEMO_MODE: "true"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      GROQ_API_KEY: ""
      SESSION_TEST_DATABASE_URL: postgresql+psycopg2://halite:test-password@localhost:5432/halite_session_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint runtime errors
        run: python -m ruff check .
      - name: Run backend tests with coverage
        run: >-
          python -m pytest -q --junitxml=test-results.xml
          --cov=api --cov=agents --cov=services --cov=graph --cov=db --cov=investigation
          --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload backend verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/coverage.xml
            backend/test-results.xml

  frontend:
    name: Frontend tests and build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build investigation feature preview
        run: npm exec vite build -- --config e2e/vite-preview.config.mjs

  docker-smoke:
    name: Docker Compose real-graph smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1
      - name: Verify Neo4j, corpus and maintenance APIs
        run: docker compose exec -T backend python scripts/verify_mid1_runtime.py
      - name: Verify persisted sessions and degraded turns
        run: >-
          docker compose exec -T
          -e SESSION_SMOKE_BASE_URL=http://127.0.0.1:8000
          -e SESSION_SMOKE_ADMIN_EMAIL=admin@halite.local
          -e SESSION_SMOKE_ADMIN_PASSWORD=HaliteDevAdmin2026
          -e SESSION_SMOKE_FIXTURE_PATH=/app/tests/fixtures/mid1_smoke.csv
          backend python scripts/verify_sessions_runtime.py
      - name: Verify frontend is served
        run: curl --fail --silent http://127.0.0.1:5173/ | grep --quiet '<div id="root">'
      - name: Capture service state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes
