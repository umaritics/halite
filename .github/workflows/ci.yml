name: CI

on:
  push:
    branches: [main, develop, usman]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEMO_MODE: "true"
      NEO4J_URI: ""
      NEO4J_PASSWORD: ""
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker Compose real-graph smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1
      - name: Verify Neo4j, corpus and maintenance APIs
        run: docker compose exec -T backend python scripts/verify_mid1_runtime.py
      - name: Verify frontend is served
        run: curl --fail --silent http://127.0.0.1:5173/ | grep --quiet '<div id="root">'
      - name: Capture service state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes
