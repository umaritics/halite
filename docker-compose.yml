services:
  neo4j:
    image: neo4j:5.20
    container_name: halite-neo4j-dev
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localdevpassword}
    volumes:
      - neo4j_dev_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-localdevpassword}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: halite-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: halite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpgpassword}
      POSTGRES_DB: halite
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halite -d halite"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Host .env often uses bolt://localhost:7687; that is the backend
      # container itself. Override so the API reaches the Neo4j & Postgres services.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdevpassword}
      DATABASE_URL: postgresql://halite:${POSTGRES_PASSWORD:-localdevpgpassword}@postgres:5432/halite
      DEMO_MODE: "false"
      SECRET_KEY: ${SECRET_KEY:-halite-local-dev-jwt-signing-secret-32chars}
      HALITE_API_KEY: ${HALITE_API_KEY:-halite-local-dev-api-key}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@halite.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-HaliteDevAdmin2026}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Halite Local Admin}
      EXPOSE_OPENAPI: ${EXPOSE_OPENAPI:-true}
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_dev_data:
  postgres_dev_data:
  frontend_node_modules:
